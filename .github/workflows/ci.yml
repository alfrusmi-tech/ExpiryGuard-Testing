name: ExpiryGuard CI

on:
  push:
    branches: [ main, master, develop, testing/ec4206-qa ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  checks: write

jobs:
  backend:
    name: Backend - JUnit + Cucumber + JaCoCo
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: expiryguard
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: ci_test_only
        ports: [ "5432:5432" ]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DB_URL: jdbc:postgresql://localhost:5432/expiryguard
      DB_USERNAME: postgres
      DB_PASSWORD: ci_test_only
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '25', cache: maven }
      - run: chmod +x mvnw
      - name: Run tests
        run: ./mvnw -B test
      - name: Test summary
        if: always()
        uses: dorny/test-reporter@v1
        with:
          name: JUnit results
          path: server/target/surefire-reports/*.xml
          reporter: java-junit
      - name: Upload JaCoCo + Cucumber reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: |
            server/target/site/jacoco/
            server/target/cucumber-report.html
            server/target/surefire-reports/

  frontend:
    name: Frontend - lint + build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: client
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '22', cache: npm, cache-dependency-path: client/package-lock.json }
      - run: npm ci
      - run: npm run lint
      - run: npm run build
